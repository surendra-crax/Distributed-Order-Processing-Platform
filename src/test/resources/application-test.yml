server:
  port: -1

spring:
  application:
    name: distributed-order-processing-platform-test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    admin:
      auto-create: false
      fail-fast: false
    consumer:
      auto-offset-reset: earliest
      group-id: test-group

  data:
    redis:
      host: localhost
      port: 6379

platform:
  kafka:
    consumer:
      enabled: false
    topics:
      orders: test.order.events
      orders-dlt: test.order.events.DLT
  outbox:
    scheduler:
      enabled: false
    polling-interval-ms: 100000
    batch-size: 10
    max-retry-attempts: 3
  idempotency:
    retention-hours: 24
  cache:
    inventory-ttl-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info
