server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: distributed-order-processing-platform-local

  datasource:
    url: jdbc:h2:mem:order_processing_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: LocalHikariPool
      maximum-pool-size: 10

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

platform:
  kafka:
    consumer:
      enabled: false
  outbox:
    polling-interval-ms: 400
    batch-size: 20
    max-retry-attempts: 3
  idempotency:
    retention-hours: 24
  cache:
    inventory-ttl-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
